<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core">
<h:head><title>Cadastro de clientes | EBAC</title><meta name="viewport" content="width=device-width, initial-scale=1"/><style>
body{font:16px system-ui;background:#f4f6f9;color:#25384a;margin:0}main{max-width:980px;margin:42px auto;padding:30px;background:white;border:1px solid #dde3eb;border-radius:12px}h1{margin-top:8px}p{color:#57687b}label{display:block;margin:15px 0 6px}input[type=text]{padding:10px;border:1px solid #9baaba;border-radius:5px;width:90%;max-width:420px}input[type=submit]{padding:9px 15px;margin:12px 8px 12px 0;background:#264d77;border:0;border-radius:4px;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{text-align:left;border-bottom:1px solid #dbe2eb;padding:10px}th{background:#f2f5fa}small{color:#607286}.mensagens{padding:12px;background:#eef5ec}a{color:#294f76}
</style></h:head><h:body><main><small>BACK-END JAVA · MÓDULOS 38 E 39</small><h1>Cadastro de clientes</h1><p>Aplicação JSF com controller, serviço, JPA e PostgreSQL.</p>
<h:messages styleClass="mensagens"/>
<h:form id="cadastro"><h:outputLabel for="nome" value="Nome"/><h:inputText id="nome" value="#{clientes.nome}" maxlength="100" required="true" requiredMessage="Informe o nome."/>
<h:outputLabel for="email" value="E-mail"/><h:inputText id="email" value="#{clientes.email}" maxlength="150" required="true" requiredMessage="Informe o e-mail."/>
<div><h:commandButton value="Salvar cliente" action="#{clientes.salvar}"/><h:commandButton value="Novo cadastro" action="#{clientes.limpar}" immediate="true"/></div></h:form>
<h2>Clientes cadastrados</h2><h:form id="lista"><h:dataTable value="#{clientes.lista}" var="cliente"><h:column><f:facet name="header">ID</f:facet><h:outputText value="#{cliente.id}"/></h:column><h:column><f:facet name="header">Nome</f:facet><h:outputText value="#{cliente.nome}"/></h:column><h:column><f:facet name="header">E-mail</f:facet><h:outputText value="#{cliente.email}"/></h:column><h:column><f:facet name="header">Ações</f:facet><h:commandButton value="Editar" action="#{clientes.editar(cliente)}"/><h:commandButton value="Excluir" action="#{clientes.excluir(cliente)}"/></h:column></h:dataTable></h:form>
<p><small>Ambiente local de exercício. Os registros usados na demonstração são fictícios.</small></p></main></h:body></html>
